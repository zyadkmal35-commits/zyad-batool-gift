<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الأصدقاء - الثعلب ضد الأرنب</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div id="particles-bg"></div>

    <div id="app">
        <!-- Lobby Screen -->
        <div id="lobby-screen" class="screen active glass-card">
            <div class="logo-emoji">🦊 ⚔️ 🐰</div>
            <h1>تحدي الثعلب والأرنب</h1>
            <p class="subtitle">العب مع أصحابك أونلاين</p>
            
            <div class="lobby-actions">
                <button id="btn-create-room" class="btn primary-btn">
                    <span>إنشاء غرفة جديدة 🦊</span>
                </button>

                <div class="divider">
                    <span>أو</span>
                </div>

                <div class="join-box">
                    <input type="text" id="join-room-code" placeholder="أدخل كود الغرفة (مثال: 1234)" maxlength="5">
                    <button id="btn-join-room" class="btn secondary-btn">
                        <span>دخول للغرفة 🐰</span>
                    </button>
                    <p id="lobby-error" class="error-text"></p>
                </div>
            </div>
        </div>

        <!-- Waiting Screen -->
        <div id="waiting-screen" class="screen glass-card hidden">
            <h2>الغرفة الخاصة بيك</h2>
            <div id="room-code-display" class="big-code">----</div>
            <p class="instruction">شارك الكود ده مع صاحبك عشان ينضم ليك..</p>
            <div class="loader"></div>
            <p class="waiting-text">بانتظار دخول اللاعب التاني (الأرنب)..</p>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen glass-card hidden">
            <div class="game-header">
                <h3>الغرفة: <span id="current-room-display"></span></h3>
                
                <div class="scores">
                    <div class="player-score fox-score">
                        <span class="avatar">🦊</span>
                        <div class="score-details">
                            <span class="name">الثعلب</span>
                            <span class="points" id="score-fox">0</span>
                        </div>
                    </div>
                    <div class="player-score rabbit-score">
                        <span class="avatar">🐰</span>
                        <div class="score-details">
                            <span class="name">الأرنب</span>
                            <span class="points" id="score-rabbit">0</span>
                        </div>
                    </div>
                </div>

                <div id="turn-indicator" class="turn-box">
                    <p id="game-status" class="status-glow">بدأت اللعبة!</p>
                </div>
            </div>

            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            
            <div class="game-controls">
                <button id="reset-game" class="btn primary-btn hidden-btn">إلعب جيم تاني 🔄</button>
                <button id="leave-room" class="btn danger-btn">الخروج من الغرفة 🚪</button>
            </div>
        </div>
    </div>

    <!-- Celebration Overlay -->
    <div id="celebration" class="celebration hidden">
        <h1 id="celebration-text"></h1>
    </div>

    <script src="script.js"></script>
</body>
</html>
